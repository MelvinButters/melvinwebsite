<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arcane Chest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>

  :root{
    --ink-black:#0b0812;
    --panel:#1b1428;
    --panel-edge:#3a2a5c;
    --gold:#c9a44c;
    --gold-bright:#f0cf7d;
    --violet:#8b5fbf;
    --violet-glow:#b489f0;
    --teal-glow:#5ce0c6;
    --parchment:#e9e2cf;
    --parchment-dim:#b9b0a0;
    --error:#c0665a;
  }

  *{ box-sizing:border-box; }

  html{
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(139,95,191,0.20), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(92,224,198,0.06), transparent 55%),
      var(--ink-black);
    background-attachment:fixed;
  }

  body{
    min-height:100vh;
    margin:0;
    color:var(--parchment);
    font-family:'Spectral', Georgia, serif;
    display:flex;
    justify-content:center;
    padding:6vh 20px;
  }

  .scene{
    margin:auto 0; /* centers vertically when there's room, never clips the top */
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  h1{
    font-family:'Cinzel Decorative', serif;
    font-weight:700;
    font-size:clamp(1.4rem, 4vw, 2rem);
    letter-spacing:0.03em;
    color:var(--gold-bright);
    margin:0 0 6px;
    text-shadow:0 0 18px rgba(201,164,76,0.35);
  }

  .subtitle{
    color:var(--parchment-dim);
    font-style:italic;
    font-size:0.98rem;
    margin:0 0 34px;
    max-width:32ch;
    line-height:1.5;
  }

  /* --- chest illustration --- */
  .chest-wrap{
    position:relative;
    width:min(82vw, 320px);
    margin-bottom:34px;
  }

  .glow-field{
    position:absolute;
    inset:-35% -25%;
    background:radial-gradient(circle, rgba(180,137,240,0.38), transparent 65%);
    filter:blur(8px);
    animation:pulse 5s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes pulse{
    0%,100%{ opacity:0.55; transform:scale(1); }
    50%{ opacity:0.95; transform:scale(1.07); }
  }

  .spark{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    box-shadow:0 0 6px 2px currentColor;
    animation:drift 6s ease-in-out infinite;
    opacity:0;
  }
  .spark:nth-child(2){ left:14%; top:64%; color:var(--gold-bright); animation-delay:0.4s; }
  .spark:nth-child(3){ left:82%; top:58%; color:var(--teal-glow); animation-delay:1.8s; }
  .spark:nth-child(4){ left:50%; top:12%; color:var(--violet-glow); animation-delay:3.1s; }
  .spark:nth-child(5){ left:28%; top:30%; color:var(--gold-bright); animation-delay:2.2s; }
  .spark:nth-child(6){ left:70%; top:22%; color:var(--teal-glow); animation-delay:4.4s; }
  .spark:nth-child(7){ left:40%; top:78%; color:var(--violet-glow); animation-delay:1.1s; }

  @keyframes drift{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    25%{ opacity:1; transform:translateY(-10px) scale(1); }
    100%{ opacity:0; transform:translateY(-52px) scale(0.6); }
  }

  svg{ position:relative; display:block; width:100%; height:auto; overflow:visible; }

  .rune-ring{
    transform-origin:170px 205px;
    animation:spin 40s linear infinite;
  }
  .rune-ring-inner{
    transform-origin:170px 205px;
    animation:spin-rev 30s linear infinite;
  }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes spin-rev{ from{ transform:rotate(360deg); } to{ transform:rotate(0deg); } }

  .rune-glyph{
    animation:rune-flicker 4s ease-in-out infinite;
  }
  .rune-glyph:nth-child(2n){ animation-delay:1.3s; }
  .rune-glyph:nth-child(3n){ animation-delay:2.1s; }
  @keyframes rune-flicker{
    0%,100%{ opacity:0.45; }
    50%{ opacity:0.9; }
  }

  .lid{ transform-origin:170px 152px; transition:transform 0.8s cubic-bezier(.4,0,.2,1); }
  .gem-core{ transition:opacity 0.4s ease; }
  .gem-pulse{ animation:gem-pulse 2.6s ease-in-out infinite; transform-origin:170px 132px; }
  @keyframes gem-pulse{
    0%,100%{ opacity:0.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.18); }
  }

  .chain{ opacity:0.85; }

  .scene.unlocked .lid{ transform:rotate(-42deg) translateY(-8px); }
  .scene.unlocked .glow-field{ animation:pulse 1.2s ease-in-out infinite; }
  .scene.unlocked .beam{ opacity:1; }
  .scene.unlocked .rune-ring, .scene.unlocked .rune-ring-inner{ animation-duration:6s; }
  .beam{ opacity:0; transition:opacity 0.5s ease 0.2s; }

  .scene.shake .chest-wrap{ animation:shake 0.5s; }
  @keyframes shake{
    10%,90%{ transform:translateX(-3px); }
    20%,80%{ transform:translateX(5px); }
    30%,50%,70%{ transform:translateX(-8px); }
    40%,60%{ transform:translateX(8px); }
  }

  /* --- form panel --- */
  form{
    width:100%;
    background:linear-gradient(180deg, var(--panel), #150f21);
    border:1px solid var(--panel-edge);
    border-radius:6px;
    padding:28px 26px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
  }

  form::before, form::after{
    content:"";
    position:absolute;
    width:9px; height:9px;
    border:1px solid var(--gold);
    opacity:0.6;
  }
  form::before{ top:8px; left:8px; border-right:none; border-bottom:none; }
  form::after{ bottom:8px; right:8px; border-left:none; border-top:none; }

  label{
    display:block;
    text-align:left;
    font-size:0.82rem;
    color:var(--parchment-dim);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }

  input[type="password"]{
    width:100%;
    font-family:'Spectral', Georgia, serif;
    font-size:1rem;
    color:var(--parchment);
    background:rgba(0,0,0,0.28);
    border:1px solid var(--panel-edge);
    border-radius:4px;
    padding:11px 13px;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }

  input::placeholder{ color:#6f6580; }

  input:focus{
    outline:none;
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(139,95,191,0.25);
  }

  button{
    margin-top:22px;
    width:100%;
    padding:13px 20px;
    font-family:'Cinzel Decorative', serif;
    font-size:0.92rem;
    letter-spacing:0.04em;
    color:var(--ink-black);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:none;
    border-radius:4px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover{ box-shadow:0 6px 22px rgba(201,164,76,0.4); transform:translateY(-1px); }
  button:active{ transform:translateY(0); }

  button:focus-visible, input:focus-visible{
    outline:2px solid var(--violet-glow);
    outline-offset:2px;
  }

  .status{
    min-height:1.2em;
    margin-top:14px;
    font-size:0.88rem;
    color:var(--error);
  }

  .status.good{ color:#8fd4b0; }

  @media (prefers-reduced-motion: reduce){
    .glow-field, .spark, .lid, .beam, .chest-wrap, .rune-ring, .rune-ring-inner, .rune-glyph, .gem-pulse{
      animation:none !important; transition:none !important;
    }
  }
</style>
</head>
<body>

<div class="scene" id="scene">

  <h1>The Arcane Chest</h1>
  <p class="subtitle">Bound by the old magic. Speak the true word of the heart, and the sigils will unwind.</p>

  <div class="chest-wrap">
    <div class="glow-field"></div>
    <span class="spark"></span><span class="spark"></span><span class="spark"></span>
    <span class="spark"></span><span class="spark"></span><span class="spark"></span>

    <svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="woodBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3f2d5c"/>
          <stop offset="100%" stop-color="#241933"/>
        </linearGradient>
        <linearGradient id="woodLid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4f3a72"/>
          <stop offset="100%" stop-color="#2e2148"/>
        </linearGradient>
        <radialGradient id="gemCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#eafff6"/>
          <stop offset="35%" stop-color="#5ce0c6"/>
          <stop offset="70%" stop-color="#8b5fbf"/>
          <stop offset="100%" stop-color="#8b5fbf" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfe9de" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#8b5fbf" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
          <stop offset="70%" stop-color="#8b5fbf" stop-opacity="0"/>
          <stop offset="100%" stop-color="#8b5fbf" stop-opacity="0.25"/>
        </radialGradient>
      </defs>

      <ellipse cx="170" cy="272" rx="132" ry="14" fill="#000" opacity="0.4"/>

      <!-- magic circle beneath the chest -->
      <circle cx="170" cy="205" r="118" fill="url(#ringGlow)"/>
      <g class="rune-ring" fill="none" stroke="var(--violet-glow)" stroke-width="1">
        <circle cx="170" cy="205" r="112" opacity="0.45" stroke-dasharray="2 6"/>
        <circle cx="170" cy="205" r="100" opacity="0.35"/>
      </g>
      <g class="rune-ring" fill="var(--violet-glow)" font-size="15" text-anchor="middle" font-family="serif">
        <text class="rune-glyph" x="170" y="98" opacity="0.7">ᛟ</text>
        <text class="rune-glyph" x="258" y="140" opacity="0.6">ᚱ</text>
        <text class="rune-glyph" x="288" y="222" opacity="0.65">ᚦ</text>
        <text class="rune-glyph" x="248" y="292" opacity="0.55">ᛝ</text>
        <text class="rune-glyph" x="92" y="292" opacity="0.6">ᚨ</text>
        <text class="rune-glyph" x="52" y="222" opacity="0.55">ᛃ</text>
        <text class="rune-glyph" x="82" y="140" opacity="0.65">ᚠ</text>
      </g>
      <g class="rune-ring-inner" fill="none" stroke="var(--teal-glow)" stroke-width="0.8" opacity="0.4">
        <polygon points="170,120 234,161 234,249 170,290 106,249 106,161"/>
      </g>

      <g class="beam" opacity="0">
        <path d="M118 152 L148 18 L192 18 L222 152 Z" fill="url(#beamGrad)"/>
      </g>

      <!-- chest body -->
      <rect x="52" y="152" width="236" height="86" rx="8" fill="url(#woodBody)" stroke="#5c4680" stroke-width="2"/>
      <rect x="52" y="152" width="236" height="18" fill="#5c4680" opacity="0.45"/>

      <!-- carved bands and rivets -->
      <g stroke="#c9a44c" stroke-width="2.2" opacity="0.75" fill="none">
        <path d="M64 164 L64 230"/>
        <path d="M276 164 L276 230"/>
        <path d="M52 197 L288 197"/>
      </g>
      <g fill="#e8cf8f" opacity="0.85">
        <circle cx="64" cy="170" r="2.4"/><circle cx="64" cy="224" r="2.4"/>
        <circle cx="276" cy="170" r="2.4"/><circle cx="276" cy="224" r="2.4"/>
        <circle cx="90" cy="197" r="2"/><circle cx="120" cy="197" r="2"/>
        <circle cx="220" cy="197" r="2"/><circle cx="250" cy="197" r="2"/>
      </g>
      <g stroke="var(--teal-glow)" stroke-width="1.1" opacity="0.5" fill="none">
        <path d="M90 162 q10 15 0 30 q-10 15 0 30"/>
        <path d="M250 162 q-10 15 0 30 q10 15 0 30"/>
        <path d="M140 210 q30 -10 60 0" opacity="0.4"/>
      </g>

      <!-- chains draped over the front -->
      <g class="chain" fill="none" stroke="#9d8ab8" stroke-width="2">
        <path d="M74 155 Q170 178 266 155" stroke-dasharray="1 9" stroke-linecap="round"/>
      </g>

      <!-- lid -->
      <g class="lid">
        <path d="M50 152 Q50 94 102 86 L238 86 Q290 94 290 152 Z" fill="url(#woodLid)" stroke="#5c4680" stroke-width="2"/>
        <path d="M62 150 Q64 102 104 96 L236 96 Q276 102 278 150" fill="none" stroke="#c9a44c" stroke-width="1.6" opacity="0.6"/>
        <g stroke="var(--teal-glow)" stroke-width="1.2" opacity="0.45" fill="none">
          <path d="M122 98 q7 22 -4 40"/>
          <path d="M218 98 q-7 22 4 40"/>
          <path d="M150 92 q20 8 40 0" opacity="0.5"/>
        </g>
        <g fill="#e8cf8f" opacity="0.8">
          <circle cx="66" cy="142" r="2.2"/><circle cx="274" cy="142" r="2.2"/>
        </g>

        <!-- gem lock centerpiece -->
        <path d="M144 150 Q144 118 170 118 Q196 118 196 150 Z" fill="#241933" stroke="#c9a44c" stroke-width="2.2"/>
        <g class="gem-pulse">
          <circle class="gem-core" cx="170" cy="132" r="11" fill="url(#gemCore)"/>
        </g>
        <path d="M170 128 L176 133 L170 146 L164 133 Z" fill="#eafff6" opacity="0.9"/>
        <path d="M155 152 q15 8 30 0" stroke="#c9a44c" stroke-width="1.4" fill="none" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <form id="chest-form" autocomplete="off">
    <div class="field">
      <label for="password">The true word of the heart</label>
      <input type="password" id="password" name="password" placeholder="Enter the true word" required>
    </div>

    <button type="submit">Unlock the Chest</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</div>

<script>
  // ---- Configuration ----
  // Change this to whatever password you want visitors to enter.
  // This check happens in the visitor's browser, so it is NOT secure —
  // anyone who views the page source can read it. Fine for a fun puzzle,
  // not for protecting anything sensitive.
  const CORRECT_PASSWORD = "babyyaga";

  // Where a correct password sends the visitor.
  const DESTINATION_PAGE = "success.html";

  const scene = document.getElementById('scene');
  const form = document.getElementById('chest-form');
  const status = document.getElementById('status');
  const passwordField = document.getElementById('password');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const entered = passwordField.value;

    if (entered === CORRECT_PASSWORD) {
      status.textContent = 'The sigils unwind...';
      status.classList.add('good');
      scene.classList.add('unlocked');
      scene.classList.remove('shake');

      setTimeout(function(){
        window.location.href = DESTINATION_PAGE;
      }, 950);
    } else {
      status.textContent = 'The chest does not stir. Wrong password.';
      status.classList.remove('good');
      scene.classList.remove('shake');
      void scene.offsetWidth; // restart animation
      scene.classList.add('shake');
      passwordField.value = '';
      passwordField.focus();
    }
  });
</script>

</body>
</html>
