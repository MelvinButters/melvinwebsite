<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Thornwood Chest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>

  :root{
    --bark-deep:#1b110a;
    --bark:#2e1d11;
    --oak:#6b4528;
    --oak-light:#8a5c35;
    --moss:#5f7a3a;
    --moss-dark:#3f5526;
    --fern:#8aa65a;
    --brass:#c79a45;
    --brass-dark:#8a6828;
    --cream:#efe4c8;
    --cream-dim:#c9bb99;
    --toadstool:#9a4a63;
    --error:#e3907c;
  }

  *{ box-sizing:border-box; }

  html{
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0,0,0,0.55) 100%),
      repeating-linear-gradient(90deg, #2b1c11 0 118px, #1a0f08 118px 120px),
      var(--bark-deep);
  }

  body{
    min-height:100vh;
    margin:0;
    color:var(--cream);
    font-family:'Alegreya', Georgia, serif;
    display:flex;
    justify-content:center;
    padding:6vh 20px;
  }

  .scene{
    margin:auto 0;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  h1{
    font-family:'Almendra', serif;
    font-weight:700;
    font-size:clamp(1.8rem, 5vw, 2.5rem);
    letter-spacing:0.01em;
    color:var(--cream);
    margin:0 0 28px;
    text-shadow:0 2px 0 var(--bark-deep);
  }

  /* --- chest illustration (static) --- */
  .chest-wrap{
    width:min(84vw, 340px);
    margin-bottom:26px;
  }

  svg{ display:block; width:100%; height:auto; overflow:visible; }

  .lid{
    transform-origin:50px 140px;
    transition:transform 0.7s cubic-bezier(.3,.1,.2,1);
  }
  .scene.unlocked .lid{ transform:translateY(-14px) rotate(-14deg); }

  .scene.shake .chest-wrap{ animation:shake 0.45s; }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px); }
    20%,80%{ transform:translateX(4px); }
    30%,50%,70%{ transform:translateX(-6px); }
    40%,60%{ transform:translateX(6px); }
  }

  /* --- form: a rough-cut plank nailed up below the chest --- */
  form{
    width:100%;
    max-width:370px;
    position:relative;
    padding:32px 36px 26px;
    color:#24140a;
    background:
      repeating-linear-gradient(180deg, rgba(70,40,15,0.10) 0 1px, transparent 1px 9px),
      linear-gradient(90deg, rgba(255,255,255,0.05), transparent 30%, rgba(0,0,0,0.06) 70%, transparent),
      #a87a4c;
    clip-path:polygon(1% 5%, 11% 0, 36% 3%, 62% 0, 87% 4%, 100% 1%, 99% 36%, 100% 68%, 98% 100%, 72% 96%, 41% 100%, 15% 97%, 0 100%, 1% 63%, 0 31%);
    text-align:center;
  }
  form::before, form::after{
    content:"";
    position:absolute;
    top:12px;
    width:7px; height:7px;
    border-radius:50%;
    background:#2b2823;
    box-shadow:0 1px 0 rgba(255,255,255,0.18);
  }
  form::before{ left:16px; }
  form::after{ right:16px; }

  input[type="password"]{
    width:100%;
    font-family:'Alegreya', Georgia, serif;
    font-size:1.2rem;
    text-align:center;
    color:#24140a;
    background:transparent;
    border:none;
    border-bottom:2px solid #3a2412;
    border-radius:0;
    padding:8px 2px;
  }

  input::placeholder{ color:#6b4a2c; font-style:italic; }

  input:focus{ outline:none; border-bottom-color:#3f5526; }
  input:focus-visible{ outline:2px solid #3f5526; outline-offset:4px; }

  button{
    margin-top:22px;
    padding:9px 26px 10px;
    font-family:'Almendra', serif;
    font-weight:700;
    font-size:1.1rem;
    color:#efe4c8;
    background:#2b2823;
    border:none;
    border-radius:2px;
    cursor:pointer;
  }

  button:hover{ background:#3b3731; }
  button:active{ transform:translateY(1px); }
  button:focus-visible{ outline:2px solid #3f5526; outline-offset:3px; }

  .status{
    min-height:1.3em;
    margin:14px 0 0;
    font-size:1.02rem;
    color:#7a2a1a;
  }
  .status.good{ color:#2f4a1a; }

  @media (prefers-reduced-motion: reduce){
    .lid, .chest-wrap{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">

  <h1>The Thornwood Chest</h1>

  <div class="chest-wrap">
    <svg viewBox="0 0 340 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A wooden chest wrapped in vines, with mushrooms growing at its base">

      <!-- ground shadow -->
      <ellipse cx="170" cy="262" rx="140" ry="10" fill="#000" opacity="0.4"/>

      <!-- chest body -->
      <rect x="50" y="140" width="240" height="108" rx="5" fill="#6b4528" stroke="#1b110a" stroke-width="3"/>
      <!-- plank seams -->
      <g stroke="#3d2412" stroke-width="2" fill="none">
        <path d="M52 176 L288 176"/>
        <path d="M52 212 L288 212"/>
      </g>
      <!-- grain -->
      <g stroke="#4f3019" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round">
        <path d="M110 152 q20 -4 44 1"/>
        <path d="M190 160 q22 4 48 -1"/>
        <path d="M70 190 q26 -5 52 0"/>
        <path d="M150 196 q30 5 62 -1"/>
        <path d="M222 226 q18 -4 40 1"/>
        <path d="M84 230 q22 4 46 -1"/>
        <path d="M164 162 q4 3 0 8"/>
      </g>
      <!-- lighter wear on plank edges -->
      <g stroke="#9a6a3e" stroke-width="1" opacity="0.55">
        <path d="M54 143 L286 143"/>
        <path d="M54 179 L286 179"/>
        <path d="M54 215 L286 215"/>
      </g>

      <!-- iron straps -->
      <g fill="#3a3731" stroke="#14100c" stroke-width="2">
        <rect x="68" y="140" width="22" height="108"/>
        <rect x="250" y="140" width="22" height="108"/>
      </g>
      <g fill="#c79a45" stroke="#6e5220" stroke-width="1">
        <circle cx="79" cy="154" r="3"/><circle cx="79" cy="194" r="3"/><circle cx="79" cy="234" r="3"/>
        <circle cx="261" cy="154" r="3"/><circle cx="261" cy="194" r="3"/><circle cx="261" cy="234" r="3"/>
      </g>

      <!-- dark gap revealed when the lid lifts -->
      <rect x="54" y="132" width="232" height="12" fill="#120a05"/>

      <!-- lid -->
      <g class="lid">
        <path d="M46 140 Q46 80 100 74 L240 74 Q294 80 294 140 Z" fill="#7a4f2e" stroke="#1b110a" stroke-width="3"/>
        <!-- lid plank seams (curved) -->
        <g stroke="#3d2412" stroke-width="2" fill="none">
          <path d="M60 112 Q170 96 280 112"/>
          <path d="M52 128 L288 128"/>
        </g>
        <g stroke="#52331a" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round">
          <path d="M114 90 q24 -3 50 1"/>
          <path d="M184 120 q22 3 46 -1"/>
          <path d="M96 120 q16 -3 34 0"/>
        </g>
        <!-- lid straps -->
        <g fill="#3a3731" stroke="#14100c" stroke-width="2">
          <path d="M68 140 Q68 88 100 78 L112 76 L112 140 Z" opacity="0"/>
          <rect x="68" y="102" width="22" height="38"/>
          <rect x="250" y="102" width="22" height="38"/>
        </g>
        <g fill="#c79a45" stroke="#6e5220" stroke-width="1">
          <circle cx="79" cy="112" r="3"/><circle cx="79" cy="130" r="3"/>
          <circle cx="261" cy="112" r="3"/><circle cx="261" cy="130" r="3"/>
        </g>
        <!-- brass band along the lid edge -->
        <rect x="46" y="136" width="248" height="8" fill="#c79a45" stroke="#6e5220" stroke-width="1.5"/>

        <!-- lock plate with keyhole -->
        <path d="M148 130 Q148 108 170 108 Q192 108 192 130 L192 160 L148 160 Z" fill="#c79a45" stroke="#6e5220" stroke-width="2.5"/>
        <circle cx="170" cy="128" r="7" fill="#1b110a"/>
        <path d="M166.5 130 L173.5 130 L175 146 L165 146 Z" fill="#1b110a"/>
        <circle cx="155" cy="115" r="2" fill="#8a6828"/>
        <circle cx="185" cy="115" r="2" fill="#8a6828"/>

        <!-- moss on top of the lid -->
        <g fill="#5f7a3a" stroke="#2f3f1b" stroke-width="1.5">
          <path d="M96 80 q6 -12 16 -4 q8 -10 18 -2 q10 -6 14 6 q-24 6 -48 0 Z"/>
          <path d="M218 76 q8 -10 18 -3 q8 -8 16 2 q6 2 6 8 q-20 4 -40 -1 Z"/>
        </g>
        <g fill="#8aa65a" opacity="0.8">
          <circle cx="112" cy="76" r="2"/><circle cx="128" cy="74" r="1.6"/>
          <circle cx="232" cy="73" r="2"/><circle cx="244" cy="76" r="1.6"/>
        </g>

        <!-- vine across the lid -->
        <path d="M54 124 Q80 96 108 104 Q140 112 152 96" fill="none" stroke="#3f5526" stroke-width="3.5" stroke-linecap="round"/>
        <g fill="#6c8a41" stroke="#2f3f1b" stroke-width="1.2">
          <path d="M80 98 q-2 -14 12 -16 q4 12 -12 16 Z"/>
          <path d="M120 108 q8 -12 20 -6 q-4 12 -20 6 Z"/>
          <path d="M64 114 q-12 -4 -10 -16 q12 2 10 16 Z"/>
        </g>
      </g>

      <!-- vine climbing the right side of the body -->
      <path d="M292 250 Q304 226 286 206 Q270 190 288 170 Q298 156 286 142" fill="none" stroke="#3f5526" stroke-width="3.5" stroke-linecap="round"/>
      <g fill="#6c8a41" stroke="#2f3f1b" stroke-width="1.2">
        <path d="M296 232 q12 -8 20 2 q-8 10 -20 -2 Z"/>
        <path d="M284 208 q-14 -8 -22 2 q8 10 22 -2 Z"/>
        <path d="M288 184 q14 -6 20 4 q-10 8 -20 -4 Z"/>
        <path d="M286 160 q-12 -8 -20 0 q8 10 20 0 Z"/>
      </g>
      <!-- small flowers -->
      <g>
        <circle cx="314" cy="236" r="3.2" fill="#e8c8d4"/><circle cx="314" cy="236" r="1.2" fill="#c79a45"/>
        <circle cx="262" cy="206" r="3.2" fill="#e8c8d4"/><circle cx="262" cy="206" r="1.2" fill="#c79a45"/>
        <circle cx="310" cy="190" r="3.2" fill="#e8c8d4"/><circle cx="310" cy="190" r="1.2" fill="#c79a45"/>
      </g>

      <!-- roots / vine at the lower left -->
      <path d="M48 250 Q36 238 46 224 Q58 210 44 196" fill="none" stroke="#3f5526" stroke-width="3" stroke-linecap="round"/>
      <g fill="#6c8a41" stroke="#2f3f1b" stroke-width="1.2">
        <path d="M44 230 q-14 -4 -18 6 q10 8 18 -6 Z"/>
        <path d="M46 206 q-12 -10 -20 -2 q8 12 20 2 Z"/>
      </g>

      <!-- grass tufts at the base -->
      <g fill="none" stroke="#5f7a3a" stroke-width="2.5" stroke-linecap="round">
        <path d="M100 252 q-4 -14 -8 -18"/><path d="M104 252 q0 -16 -1 -22"/><path d="M108 252 q4 -12 8 -16"/>
        <path d="M200 252 q-3 -12 -7 -16"/><path d="M204 252 q1 -14 0 -20"/><path d="M208 252 q5 -10 9 -14"/>
      </g>

      <!-- toadstools by the left foot -->
      <g>
        <path d="M140 254 L140 240 Q140 236 144 236 Q148 236 148 240 L148 254 Z" fill="#e9dcc0" stroke="#1b110a" stroke-width="1.5"/>
        <path d="M128 240 Q128 222 144 222 Q160 222 160 240 Z" fill="#9a4a63" stroke="#1b110a" stroke-width="2"/>
        <circle cx="138" cy="231" r="2.2" fill="#efe4c8"/><circle cx="150" cy="229" r="2" fill="#efe4c8"/><circle cx="145" cy="236" r="1.4" fill="#efe4c8"/>
      </g>
      <g>
        <path d="M162 256 L162 248 Q162 245 165 245 Q168 245 168 248 L168 256 Z" fill="#e9dcc0" stroke="#1b110a" stroke-width="1.5"/>
        <path d="M154 248 Q154 237 165 237 Q176 237 176 248 Z" fill="#c79a45" stroke="#1b110a" stroke-width="2"/>
        <circle cx="161" cy="243" r="1.4" fill="#efe4c8"/><circle cx="170" cy="242" r="1.4" fill="#efe4c8"/>
      </g>
      <!-- fallen leaf -->
      <path d="M236 258 q10 -8 22 -2 q-8 10 -22 2 Z" fill="#a8742f" stroke="#1b110a" stroke-width="1.2"/>
    </svg>
  </div>

  <form id="chest-form" autocomplete="off">
    <div class="field">
      <input type="password" id="password" name="password" aria-label="Password" required>
    </div>

    <button type="submit">Speak the words</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</div>

<script>
  // ---- Configuration ----
  // Change this to whatever password you want visitors to enter.
  // This check happens in the visitor's browser, so it is NOT secure —
  // anyone who views the page source can read it. Fine for a fun puzzle,
  // not for protecting anything sensitive.
  const CORRECT_PASSWORD = "babayaga";

  // Where a correct password sends the visitor.
  const DESTINATION_PAGE = "feytales.html";

  const scene = document.getElementById('scene');
  const form = document.getElementById('chest-form');
  const status = document.getElementById('status');
  const passwordField = document.getElementById('password');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const entered = passwordField.value;

    if (entered === CORRECT_PASSWORD) {
      status.textContent = 'The roots loosen...';
      status.classList.add('good');
      scene.classList.add('unlocked');
      scene.classList.remove('shake');

      setTimeout(function(){
        window.location.href = DESTINATION_PAGE;
      }, 950);
    } else {
      status.textContent = 'The chest does not stir. Wrong password.';
      status.classList.remove('good');
      scene.classList.remove('shake');
      void scene.offsetWidth; // restart animation
      scene.classList.add('shake');
      passwordField.value = '';
      passwordField.focus();
    }
  });
</script>

</body>
</html>
